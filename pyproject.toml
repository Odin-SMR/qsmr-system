[project]
name = "qsmr-system"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.25.0",
    "boto3>=1.42.17",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "pyhumps>=3.8.0",
]

[build-system]
requires = ["uv-build>=0.1.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3,sqs]>=1.42.17",
    "ipykernel>=7.1.0",
    "openapi-python-client>=0.28.0",
    "pandas-stubs>=2.3.3.251201",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "ty>=0.0.11",
]

[pytest]
markers = ["system"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
